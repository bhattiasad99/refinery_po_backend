services:

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: ${API_GATEWAY_PORT:-8000}
      INTERNAL_SERVICE_KEY: ${GLOBAL_INTERNAL_SERVICE_KEY:-refinery-local-key}
      SERVICE_CATALOG_URL: ${SERVICE_CATALOG_URL}
      SERVICE_PURCHASE_ORDERS_URL: ${SERVICE_PURCHASE_ORDERS_URL}
    command: npm run start:prod
    ports:
      - "${API_GATEWAY_PORT:-8000}:${API_GATEWAY_PORT:-8000}"
    depends_on:
      - catalog
      - purchase-orders
      - event-bus

  catalog:
    build:
      context: ./catalog
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: ${CATALOG_PORT:-8002}
      INTERNAL_SERVICE_KEY: ${GLOBAL_INTERNAL_SERVICE_KEY:-refinery-local-key}
      DATABASE_URL: ${CATALOG_DATABASE_URL}
      EVENT_BUS_URL: ${SERVICE_EVENT_BUS_URL:-http://event-bus:8001}
    command: npm run start
    depends_on:
      - event-bus

  purchase-orders:
    build:
      context: ./purchase-orders
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: ${PURCHASE_ORDERS_PORT:-8003}
      INTERNAL_SERVICE_KEY: ${GLOBAL_INTERNAL_SERVICE_KEY:-refinery-local-key}
      DATABASE_URL: ${PURCHASE_ORDERS_DATABASE_URL}
      EVENT_BUS_URL: ${SERVICE_EVENT_BUS_URL:-http://event-bus:8001}
    command: npm run start
    depends_on:
      - event-bus

  event-bus:
    build:
      context: ./event-bus
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: ${EVENT_BUS_PORT:-8001}
      INTERNAL_SERVICE_KEY: ${GLOBAL_INTERNAL_SERVICE_KEY:-refinery-local-key}
      DATABASE_URL: ${EVENT_BUS_DATABASE_URL}
      SERVICE_CATALOG_URL: ${SERVICE_CATALOG_URL}
      SERVICE_PURCHASE_ORDERS_URL: ${SERVICE_PURCHASE_ORDERS_URL}
    command: npm run start
