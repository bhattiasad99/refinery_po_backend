services:

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./.env.local
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: UsePolling
      TSC_WATCHDIRECTORY: UsePolling
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      SERVICE_CATALOG_URL: http://catalog:8002
      SERVICE_PURCHASE_ORDERS_URL: http://purchase-orders:8003
      SERVICE_EVENT_BUS_URL: http://event-bus:8001
    command: npm run start:dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.API_GATEWAY_PORT || 3000) + '/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    depends_on:
      catalog:
        condition: service_healthy
      purchase-orders:
        condition: service_healthy
      event-bus:
        condition: service_healthy
      departments:
        condition: service_healthy

  catalog:
