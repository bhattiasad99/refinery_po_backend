services:

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./.env.local
    environment:
      NODE_ENV: development
      PORT: ${API_GATEWAY_PORT:-8000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-refinery-local-key}
      SERVICE_CATALOG_URL: ${SERVICE_CATALOG_URL:-http://catalog:8002}
      SERVICE_PURCHASE_ORDERS_URL: ${SERVICE_PURCHASE_ORDERS_URL:-http://purchase-orders:8003}
    command: npm run start:dev
    ports:
      - "${API_GATEWAY_PORT:-8000}:${API_GATEWAY_PORT:-8000}"
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    depends_on:
      - catalog
      - purchase-orders
      - event-bus

  catalog:
    build:
      context: ./catalog
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./.env.local
    environment:
      NODE_ENV: development
      PORT: ${CATALOG_PORT:-8002}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-refinery-local-key}
      DATABASE_URL: ${CATALOG_DATABASE_URL}
      EVENT_BUS_URL: ${SERVICE_EVENT_BUS_URL:-http://event-bus:8001}
    command: npm run dev
    volumes:
      - ./catalog:/app
      - /app/node_modules
    depends_on:
      - event-bus

  purchase-orders:
    build:
      context: ./purchase-orders
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./.env.local
    environment:
      NODE_ENV: development
      PORT: ${PURCHASE_ORDERS_PORT:-8003}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-refinery-local-key}
      DATABASE_URL: ${PURCHASE_ORDERS_DATABASE_URL}
      EVENT_BUS_URL: ${SERVICE_EVENT_BUS_URL:-http://event-bus:8001}
    command: npm run dev
    volumes:
      - ./purchase-orders:/app
      - /app/node_modules
    depends_on:
      - event-bus

  event-bus:
    build:
      context: ./event-bus
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ./.env.local
    environment:
      NODE_ENV: development
      PORT: ${EVENT_BUS_PORT:-8001}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-refinery-local-key}
      DATABASE_URL: ${EVENT_BUS_DATABASE_URL}
      SERVICE_CATALOG_URL: ${SERVICE_CATALOG_URL:-http://catalog:8002}
      SERVICE_PURCHASE_ORDERS_URL: ${SERVICE_PURCHASE_ORDERS_URL:-http://purchase-orders:8003}
    command: npm run dev
    volumes:
      - ./event-bus:/app
      - /app/node_modules
